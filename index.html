<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4ed8" />
  <title>ANGEL LANGUAGE — One World. Every Language.</title>
  <style>
    :root {
      --blue-950: #0a1b47;
      --blue-900: #0f2a6b;
      --blue-700: #1d4ed8;
      --blue-600: #2563eb;
      --blue-500: #3b82f6;
      --blue-200: #bfdbfe;
      --blue-100: #dbeafe;
      --blue-50: #eff6ff;
      --white: #ffffff;
      --slate-900: #0f172a;
      --slate-600: #475569;
      --green-600: #16a34a;
      --green-50: #f0fdf4;
      --red-600: #dc2626;
      --red-50: #fef2f2;
      --amber-700: #b45309;
      --amber-50: #fffbeb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 50%, #ffffff 100%);
      color: var(--slate-900);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Mobile App Shell */
    .phone-shell {
      width: 100%;
      min-height: 100vh;
      background: #f8fbff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 540px) {
      body { padding: 1.2rem; }
      .phone-shell {
        max-width: 460px;
        height: 860px;
        min-height: 760px;
        max-height: 94vh;
        border-radius: 34px;
        border: 8px solid var(--blue-900);
        box-shadow: 0 28px 75px rgba(15, 42, 107, 0.28);
      }
    }

    /* Top App Bar */
    .app-bar {
      background: linear-gradient(135deg, var(--blue-900), var(--blue-600));
      color: var(--white);
      padding: 0.8rem 0.95rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 0.55rem; min-width: 0; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 11px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.35);
      display: grid; place-items: center; font-weight: 800; font-size: 0.92rem; flex-shrink: 0;
    }
    .brand-title { font-weight: 800; font-size: 0.95rem; letter-spacing: 0.04em; line-height: 1.1; }
    .brand-sub { font-size: 0.66rem; color: var(--blue-100); font-weight: 600; }

    .top-badges { display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0; }
    .top-pill {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.32);
      color: var(--white);
      padding: 0.3rem 0.55rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      display: inline-flex; align-items: center; gap: 0.25rem;
      cursor: pointer;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #fbbf24; }
    .dot.live { background: #4ade80; }

    /* Scrollable App Content */
    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 0.9rem;
      padding-bottom: 1.25rem;
    }

    .screen { display: none; animation: fadeUp 0.18s ease; }
    .screen.active { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards & Typography */
    .card {
      background: var(--white);
      border: 1.5px solid var(--blue-100);
      border-radius: 18px;
      padding: 0.95rem;
      margin-bottom: 0.85rem;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.07);
    }

    .section-lbl {
      font-size: 0.76rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--blue-700); margin-bottom: 0.55rem;
      display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
    }

    /* Flag Language Selector */
    .flag-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }

    .flag-btn {
      background: var(--white);
      border: 2px solid var(--blue-100);
      border-radius: 16px;
      padding: 0.7rem 0.3rem;
      text-align: center;
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
      transition: all 0.18s ease;
      font-family: inherit;
    }

    .flag-btn.active {
      background: linear-gradient(160deg, var(--blue-700), var(--blue-500));
      border-color: var(--blue-700);
      color: var(--white);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28);
    }

    .flag-emoji { font-size: 1.9rem; line-height: 1.1; }
    .flag-country { font-size: 0.8rem; font-weight: 800; }
    .flag-lang {
      font-size: 0.68rem; font-weight: 700;
      padding: 0.12rem 0.45rem; border-radius: 999px;
      background: var(--blue-50); color: var(--blue-700);
    }
    .flag-btn.active .flag-lang { background: rgba(255,255,255,0.22); color: var(--white); }

    /* Sub-tabs */
    .sub-tabs {
      display: flex; gap: 0.35rem; overflow-x: auto; padding-bottom: 0.4rem; margin-bottom: 0.7rem;
      scrollbar-width: none;
    }
    .sub-tabs::-webkit-scrollbar { display: none; }
    .sub-tab {
      flex: 0 0 auto;
      padding: 0.42rem 0.75rem; border-radius: 999px;
      border: 1.5px solid var(--blue-200); background: var(--white);
      color: var(--blue-900); font-size: 0.75rem; font-weight: 700; cursor: pointer;
    }
    .sub-tab.active { background: var(--blue-600); border-color: var(--blue-600); color: var(--white); }

    /* Buttons & Inputs */
    .btn {
      min-height: 42px; padding: 0.55rem 0.9rem;
      border-radius: 12px; border: none;
      background: var(--blue-600); color: var(--white);
      font-weight: 700; font-size: 0.84rem; font-family: inherit;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
    }
    .btn:active { transform: scale(0.98); }
    .btn-outline { background: var(--white); color: var(--blue-700); border: 1.5px solid var(--blue-500); }
    .btn-sm { min-height: 34px; padding: 0.32rem 0.65rem; font-size: 0.76rem; border-radius: 10px; }

    .input, .select, .textarea {
      width: 100%; min-height: 40px; padding: 0.55rem 0.8rem;
      border-radius: 12px; border: 1.5px solid var(--blue-200);
      font-family: inherit; font-size: 0.88rem; outline: none; background: var(--white);
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--blue-600); }

    /* Chat Areas */
    .chat-box {
      background: var(--blue-50);
      border: 1px solid var(--blue-100);
      border-radius: 14px;
      padding: 0.7rem;
      height: 225px;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.55rem;
      margin-bottom: 0.65rem;
    }

    .bubble {
      max-width: 88%; padding: 0.65rem 0.82rem; border-radius: 14px;
      font-size: 0.84rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
    }
    .bubble.ai { align-self: flex-start; background: var(--white); border: 1px solid var(--blue-100); }
    .bubble.user { align-self: flex-end; background: var(--blue-600); color: var(--white); }

    /* AI Speaking Teacher Correction Card inside Bubble */
    .st-turn-card {
      align-self: flex-start;
      max-width: 94%;
      background: var(--white);
      border: 1.5px solid var(--blue-200);
      border-radius: 16px;
      padding: 0.75rem;
      font-size: 0.83rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.06);
      display: flex; flex-direction: column; gap: 0.45rem;
    }
    .st-reply-text { color: var(--blue-950); font-weight: 600; }
    .st-correction-box {
      background: var(--green-50);
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 0.5rem 0.65rem;
      font-size: 0.78rem;
      color: #14532d;
    }
    .st-nepali-box {
      background: var(--amber-50);
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 0.5rem 0.65rem;
      font-size: 0.78rem;
      color: #78350f;
    }
    .st-audio-row { display: flex; gap: 0.35rem; flex-wrap: wrap; }

    .chip-row { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.6rem; }
    .chip {
      padding: 0.3rem 0.62rem; border-radius: 999px;
      border: 1px solid var(--blue-200); background: var(--white);
      color: var(--blue-700); font-size: 0.72rem; font-weight: 700; cursor: pointer;
    }

    /* Script Character Grid */
    .char-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.45rem;
      margin-bottom: 0.75rem;
    }

    .char-card {
      background: var(--blue-50);
      border: 1.5px solid var(--blue-100);
      border-radius: 12px;
      padding: 0.55rem 0.25rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease;
      font-family: inherit;
    }
    .char-card:hover { border-color: var(--blue-500); transform: translateY(-2px); }
    .char-main { font-size: 1.35rem; font-weight: 800; color: var(--blue-900); line-height: 1.2; }
    .char-sub { font-size: 0.7rem; font-weight: 700; color: var(--blue-600); }
    .char-note { font-size: 0.62rem; color: var(--slate-600); }

    /* Phrase Pill */
    .phrase-item {
      background: var(--blue-50);
      border: 1px solid var(--blue-100);
      border-radius: 12px;
      padding: 0.7rem;
      display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
      margin-bottom: 0.45rem;
    }

"></span>
          <span id="gemini-label">AI</span>    /* Voice Orb */
    .orb-wrap { text-align: center; padding: 0.45rem 0; }
    .mic-orb {
      width: 74px; height: 74px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, var(--blue-700), var(--blue-500));
      color: var(--white); font-size: 1.8rem; cursor: pointer;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      margin-bottom: 0.4rem;
    }
    .mic-orb.listening {
      background: linear-gradient(135deg, #dc2626, #ef4444);
      animation: pulse 1.1s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.55); }
      70% { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .result-box {
      margin-top: 0.65rem; padding: 0.8rem; border-radius: 12px;
      background: var(--blue-50); border: 1px solid var(--blue-200);
      font-size: 0.84rem; white-space: pre-wrap;
    }

    /* Quiz Options */
    .quiz-opt {
      width: 100%; text-align: left; min-height: 42px;
      padding: 0.6rem 0.8rem; border-radius: 12px;
      border: 1.5px solid var(--blue-200); background: var(--white);
      color: var(--slate-900); font-weight: 700; font-size: 0.85rem;
      cursor: pointer; margin-bottom: 0.45rem; font-family: inherit;
    }
    .quiz-opt.correct { background: var(--green-50); border-color: var(--green-600); color: var(--green-600); }
    .quiz-opt.wrong { background: var(--red-50); border-color: var(--red-600); color: var(--red-600); }

    /* Progress Bars & Stats */
    .stat-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.55rem; margin-bottom: 0.85rem;
    }
    .stat-box {
      background: var(--blue-50); border: 1px solid var(--blue-100);
      border-radius: 14px; padding: 0.75rem; text-align: center;
    }
    .stat-val { font-size: 1.35rem; font-weight: 800; color: var(--blue-700); }
    .stat-lbl { font-size: 0.72rem; font-weight: 700; color: var(--slate-600); }

    .bar-track {
      width: 100%; height: 9px; background: var(--blue-100); border-radius: 999px; overflow: hidden; margin-top: 0.3rem;
    }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--blue-700), var(--blue-500)); transition: width 0.3s ease; }

    /* Bottom Navigation */
    .bottom-nav {
      background: var(--white);
      border-top: 1px solid var(--blue-100);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 0.35rem 0.2rem calc(0.35rem + env(safe-area-inset-bottom));
      flex-shrink: 0;
    }

    .nav-btn {
      background: transparent; border: none;
      display: flex; flex-direction: column; align-items: center; gap: 0.12rem;
      padding: 0.32rem 0.1rem; border-radius: 10px;
      color: var(--slate-600); font-size: 0.64rem; font-weight: 700; cursor: pointer;
    }
    .nav-btn span.ico { font-size: 1.15rem; }
    .nav-btn.active { color: var(--blue-700); background: var(--blue-50); }

    /* Modal & Toast */
    .modal-bg {
      position: absolute; inset: 0; background: rgba(10, 27, 71, 0.55);
      display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 60;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--white); border-radius: 20px; padding: 1.15rem; width: 100%;
      box-shadow: 0 20px 50px rgba(10, 27, 71, 0.3);
    }

    .toast {
      position: absolute; top: 64px; right: 14px;
      background: var(--blue-950); color: var(--white);
      padding: 0.45rem 0.8rem; border-radius: 10px;
      font-size: 0.76rem; font-weight: 700; z-index: 70;
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="phone-shell">
    <!-- Top App Bar -->
    <header class="app-bar">
      <div class="brand">
        <div class="brand-icon">AL</div>
        <div>
          <div class="brand-title">ANGEL LANGUAGE</div>
          <div class="brand-sub">One World. Every Language.</div>
        </div>
      </div>

      <div class="top-badges">
        <span class="top-pill" id="top-streak">🔥 1d</span>
        <span class="top-pill" id="top-xp">⭐ 0</span>
        <button type="button" class="top-pill" id="open-setup">
          <span class="dot" id="gemini-dot
        </button>
      </div>
    </header>

    <div class="toast" id="toast"></div>

    <!-- Main Content -->
    <main class="app-content">

      <!-- ==================== SCREEN 1: LEARN (NEPAL, JAPAN, SOUTH KOREA + SCRIPTS + AI TEACHER) ==================== -->
      <section class="screen active" id="screen-learn">
        <div class="section-lbl">
          <span>Select Country &amp; Language</span>
          <span id="learn-active-badge" style="color:var(--blue-600);">Nepal • नेपाली</span>
        </div>

        <div class="flag-row">
          <button type="button" class="flag-btn active" data-lang="ne">
            <span class="flag-emoji">🇳🇵</span>
            <span class="flag-country">Nepal</span>
            <span class="flag-lang">नेपाली</span>
          </button>
          <button type="button" class="flag-btn" data-lang="ja">
            <span class="flag-emoji">🇯🇵</span>
            <span class="flag-country">Japan</span>
            <span class="flag-lang">日本語</span>
          </button>
          <button type="button" class="flag-btn" data-lang="ko">
            <span class="flag-emoji">🇰🇷</span>
            <span class="flag-country">South Korea</span>
            <span class="flag-lang">한국어</span>
          </button>
        </div>

        <!-- Studio Sub-tabs -->
        <div class="sub-tabs" id="learn-subtabs">
          <button type="button" class="sub-tab active" data-sub="ai-teacher">🤖 AI Teacher</button>
          <button type="button" class="sub-tab" data-sub="scripts" id="scripts-tab-label">📖 Script &amp; Writing</button>
          <button type="button" class="sub-tab" data-sub="phrases">🔊 Phrases &amp; Mic</button>
        </div>

        <!-- Sub 1: AI Teacher -->
        <div id="sub-ai-teacher" class="card">
          <div class="section-lbl">
            <span id="teacher-title">🤖 AI Teacher: Nepal (नेपाली)</span>
            <button type="button" class="btn btn-outline btn-sm" id="hear-greet">🔊 Greet</button>
          </div>
          <div class="chip-row" id="teacher-chips"></div>
          <div class="chat-box" id="teacher-chat"></div>
          <form id="teacher-form" style="display:flex; gap:0.45rem;">
            <input type="text" class="input" id="teacher-input" placeholder="Ask AI Teacher..." required />
            <button type="submit" class="btn">Ask</button>
          </form>
        </div>

        <!-- Sub 2: Script Lessons -->
        <div id="sub-scripts" class="card" style="display:none;">
          <div class="section-lbl">
            <span id="script-title">Script Lessons</span>
            <span style="font-size:0.7rem; color:var(--slate-600);">Tap any card to hear</span>
          </div>
          <div class="sub-tabs" id="script-mode-tabs"></div>
          <div class="char-grid" id="script-grid"></div>

          <div style="background:var(--blue-50); border:1px solid var(--blue-100); border-radius:12px; padding:0.75rem; margin-bottom:0.65rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.35rem;">
              <strong style="font-size:0.8rem; color:var(--blue-900);">📖 Reading Practice</strong>
              <button type="button" class="btn btn-outline btn-sm" id="script-read-audio">🔊 Listen</button>
            </div>
            <div id="script-reading-native" style="font-size:0.95rem; font-weight:700; color:var(--blue-950);"></div>
            <div id="script-reading-rom" style="font-size:0.78rem; color:var(--blue-700); margin-top:0.2rem;"></div>
            <div id="script-reading-eng" style="font-size:0.76rem; color:var(--slate-600); margin-top:0.15rem;"></div>
          </div>

          <strong style="display:block; font-size:0.8rem; color:var(--blue-900); margin-bottom:0.3rem;">✍️ Writing Practice</strong>
          <textarea id="script-write-input" class="textarea" rows="2" placeholder="Write a word or sentence in this script..."></textarea>
          <button type="button" class="btn btn-sm" id="script-write-check" style="width:100%; margin-top:0.45rem;">Check Writing with Gemini AI</button>
          <div class="result-box" id="script-write-result" style="display:none;"></div>
        </div>

        <!-- Sub 3: Phrases & Speaking -->
        <div id="sub-phrases" class="card" style="display:none;">
          <div class="section-lbl"><span>🔊 Essential Phrases &amp; Mic Practice</span></div>
          <div id="phrase-list"></div>
          <div class="result-box" id="phrase-mic-feedback">🎤 Tap Listen or Speak on any phrase above.</div>
        </div>
      </section>
